<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="index, follow">
  <title>Demander un devis — 4N Dev</title>
  <meta name="description" content="Demandez un devis à 4N Dev pour vos projets web, mobile, IA et automatisation.">
  <style>
    :root{--bg:#050711;--surface:rgba(255,255,255,.06);--border:rgba(255,255,255,.12);--text:#f6f7ff;--muted:#a9aec4;--gradient:linear-gradient(135deg,#2de2ff,#2f8cff 35%,#8b5cff 70%,#bd55ff)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 15% 10%,rgba(47,140,255,.14),transparent 30%),radial-gradient(circle at 85% 15%,rgba(139,92,255,.14),transparent 32%),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
    a{color:inherit;text-decoration:none}.wrap{width:min(100% - 32px,760px);margin:auto;padding:32px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.brand{font-weight:900;font-size:1.1rem}.back{padding:10px 15px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
    .card{padding:28px;border:1px solid var(--border);border-radius:24px;background:var(--surface);backdrop-filter:blur(18px);box-shadow:0 20px 70px rgba(0,0,0,.4)}h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1.08;margin:0 0 12px}p{color:var(--muted);margin:0 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:8px}.full{grid-column:1/-1}label{font-weight:700;font-size:.92rem}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:13px;background:rgba(0,0,0,.2);color:var(--text);padding:13px 14px;outline:none}textarea{min-height:150px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#5f8cff;box-shadow:0 0 0 3px rgba(95,140,255,.14)}button{width:100%;margin-top:20px;min-height:52px;border:0;border-radius:14px;color:#fff;background:var(--gradient);font-weight:900;font-size:1rem;cursor:pointer}small{display:block;margin-top:14px;color:var(--muted);text-align:center}@media(max-width:640px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:22px}.top{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><a class="brand" href="index.html">4N Dev</a><a class="back" href="index.html">← Retour au site</a></div>
    <section class="card">
      <h1>Demander un <span style="background:var(--gradient);color:transparent;background-clip:text;-webkit-background-clip:text">devis</span></h1>
      <p>Décrivez votre projet. Votre demande sera envoyée à 4N Dev via le même système Formspree déjà utilisé par le site.</p>
      <form action="https://formspree.io/f/mzebyjyn" method="POST">
        <div class="grid">
          <div class="field"><label for="name">Nom / entreprise</label><input id="name" name="name" required></div>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
          <div class="field"><label for="service">Service</label><select id="service" name="service" required><option value="">Choisir</option><option>Site web</option><option>Application mobile</option><option>Solution IA</option><option>Automatisation</option><option>UI/UX</option><option>Autre</option></select></div>
          <div class="field"><label for="budget">Budget indicatif</label><select id="budget" name="budget"><option value="">Choisir</option><option>Moins de 500 000 Ar</option><option>500 000 – 1 500 000 Ar</option><option>1 500 000 – 5 000 000 Ar</option><option>Plus de 5 000 000 Ar</option><option>À définir</option></select></div>
          <div class="field full"><label for="message">Décrivez votre projet</label><textarea id="message" name="message" required placeholder="Objectif, fonctionnalités, délai, etc."></textarea></div>
        </div>
        <input type="hidden" name="_subject" value="Nouvelle demande de devis — 4N Dev">
        <input type="hidden" name="_source" value="4N Dev — formulaire devis">
        <button type="submit">Envoyer ma demande de devis</button>
        <small>Formulaire sécurisé • 4N Dev</small>
      </form>
    </section>
  </main>
</body>
</html>
