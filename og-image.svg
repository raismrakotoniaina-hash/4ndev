<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#050817"/>
      <stop offset="45%" stop-color="#0A1028"/>
      <stop offset="100%" stop-color="#09051A"/>
    </linearGradient>

    <!-- Main gradient -->
    <linearGradient id="brand" x1="260" y1="180" x2="920" y2="470">
      <stop offset="0%" stop-color="#36D9FF"/>
      <stop offset="48%" stop-color="#6C7BFF"/>
      <stop offset="100%" stop-color="#B64DFF"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="360" y1="250" x2="850" y2="360">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#BEEFFF"/>
      <stop offset="100%" stop-color="#C9A8FF"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glowBlue" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSmall" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path
        d="M 50 0 L 0 0 0 50"
        fill="none"
        stroke="#6C7BFF"
        stroke-opacity="0.09"
        stroke-width="1"
      />
    </pattern>

    <!-- Glass -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.025"/>
    </linearGradient>

  </defs>

  <!-- ===================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================== -->

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <circle
    cx="170"
    cy="110"
    r="180"
    fill="#167DFF"
    fill-opacity="0.12"
    filter="url(#glowBlue)"
  />

  <circle
    cx="1060"
    cy="520"
    r="210"
    fill="#9B36FF"
    fill-opacity="0.12"
    filter="url(#glowBlue)"
  />

  <!-- ===================================== -->
  <!-- DECORATIVE ORBIT -->
  <!-- ===================================== -->

  <ellipse
    cx="600"
    cy="315"
    rx="510"
    ry="235"
    stroke="url(#brand)"
    stroke-opacity="0.12"
    stroke-width="2"
  />

  <ellipse
    cx="600"
    cy="315"
    rx="420"
    ry="185"
    stroke="#36D9FF"
    stroke-opacity="0.08"
    stroke-width="1"
  />

  <!-- ===================================== -->
  <!-- TOP BRAND MARK -->
  <!-- ===================================== -->

  <g transform="translate(88 70)">

    <!-- Logo box -->
    <rect
      width="76"
      height="76"
      rx="20"
      fill="url(#brand)"
      fill-opacity="0.18"
      stroke="url(#brand)"
      stroke-opacity="0.55"
      stroke-width="2"
    />

    <!-- Logo highlight -->
    <rect
      x="2"
      y="2"
      width="72"
      height="36"
      rx="18"
      fill="white"
      fill-opacity="0.08"
    />

    <!-- 4N -->
    <text
      x="38"
      y="51"
      text-anchor="middle"
      fill="white"
      font-family="Arial, Helvetica, sans-serif"
      font-size="24"
      font-weight="900"
      letter-spacing="-1"
    >4N</text>

  </g>

  <!-- Brand name -->

  <text
    x="182"
    y="104"
    fill="white"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28"
    font-weight="800"
    letter-spacing="-1"
  >4N Dev</text>

  <text
    x="183"
    y="130"
    fill="#7F9AFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="600"
    letter-spacing="2.5"
  >DIGITAL • AI • INNOVATION</text>

  <!-- ===================================== -->
  <!-- MAIN CONTENT -->
  <!-- ===================================== -->

  <text
    x="600"
    y="260"
    text-anchor="middle"
    fill="url(#textGradient)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="78"
    font-weight="900"
    letter-spacing="-4"
  >4N Dev</text>

  <text
    x="600"
    y="318"
    text-anchor="middle"
    fill="#FFFFFF"
    fill-opacity="0.92"
    font-family="Arial, Helvetica, sans-serif"
    font-size="27"
    font-weight="500"
    letter-spacing="1"
  >Studio digital &amp; solutions IA</text>

  <!-- Accent line -->

  <rect
    x="470"
    y="350"
    width="260"
    height="3"
    rx="2"
    fill="url(#brand)"
    filter="url(#glowSmall)"
  />

  <!-- Tagline -->

  <text
    x="600"
    y="397"
    text-anchor="middle"
    fill="#AEB9D8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19"
    font-weight="400"
    letter-spacing="0.5"
  >Nous créons le digital de demain</text>

  <!-- ===================================== -->
  <!-- TECHNOLOGY LABELS -->
  <!-- ===================================== -->

  <g transform="translate(320 450)">

    <!-- WEB -->
    <rect
      x="0"
      y="0"
      width="120"
      height="44"
      rx="22"
      fill="url(#glass)"
      stroke="#36D9FF"
      stroke-opacity="0.28"
    />

    <circle
      cx="24"
      cy="22"
      r="5"
      fill="#36D9FF"
      filter="url(#glowSmall)"
    />

    <text
      x="42"
      y="28"
      fill="#D8F8FF"
      font-family="Arial, Helvetica, sans-serif"
      font-size="14"
      font-weight="700"
    >WEB</text>

    <!-- MOBILE -->
    <rect
      x="135"
      y="0"
      width="135"
      height="44"
      rx="22"
      fill="url(#glass)"
      stroke="#6C7BFF"
      stroke-opacity="0.28"
    />

    <circle
      cx="159"
      cy="22"
      r="5"
      fill="#6C7BFF"
      filter="url(#glowSmall)"
    />

    <text
      x="177"
      y="28"
      fill="#E2E4FF"
      font-family="Arial, Helvetica, sans-serif"
      font-size="14"
      font-weight="700"
    >MOBILE</text>

    <!-- AI -->
    <rect
      x="285"
      y="0"
      width="100"
      height="44"
      rx="22"
      fill="url(#glass)"
      stroke="#B64DFF"
      stroke-opacity="0.32"
    />

    <circle
      cx="309"
      cy="22"
      r="5"
      fill="#B64DFF"
      filter="url(#glowSmall)"
    />

    <text
      x="327"
      y="28"
      fill="#F1DFFF"
      font-family="Arial, Helvetica, sans-serif"
      font-size="14"
      font-weight="700"
    >AI</text>

    <!-- AUTOMATION -->
    <rect
      x="400"
      y="0"
      width="170"
      height="44"
      rx="22"
      fill="url(#glass)"
      stroke="#7388FF"
      stroke-opacity="0.28"
    />

    <circle
      cx="424"
      cy="22"
      r="5"
      fill="#7388FF"
      filter="url(#glowSmall)"
    />

    <text
      x="442"
      y="28"
      fill="#E2E6FF"
      font-family="Arial, Helvetica, sans-serif"
      font-size="14"
      font-weight="700"
    >AUTOMATION</text>

  </g>

  <!-- ===================================== -->
  <!-- BOTTOM TECH LINE -->
  <!-- ===================================== -->

  <path
    d="M80 570 H1120"
    stroke="url(#brand)"
    stroke-opacity="0.22"
    stroke-width="1"
  />

  <circle
    cx="80"
    cy="570"
    r="4"
    fill="#36D9FF"
    filter="url(#glowSmall)"
  />

  <circle
    cx="1120"
    cy="570"
    r="4"
    fill="#B64DFF"
    filter="url(#glowSmall)"
  />

  <text
    x="80"
    y="598"
    fill="#647195"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="2"
  >4NDEV • DIGITAL FUTURE</text>

  <text
    x="1120"
    y="598"
    text-anchor="end"
    fill="#647195"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="1"
  >WEB • MOBILE • AI</text>

</svg>
